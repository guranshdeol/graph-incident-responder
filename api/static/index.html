<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>rootgraph console</title>
<meta name="description" content="rootgraph: incident root cause on a FalkorDB graph of your infrastructure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
/* Design tokens from docs/DESIGN.md ("frosted glass cathedral at midnight"), at console density.
   Untitled Sans -> Inter, aeonikPro -> Space Grotesk, dotDigital -> JetBrains Mono.
   Violet is the single primary action; ember / teal / amber carry status only. */
:root {
  --canvas: #05060f; --panel: #080a16; --steel: #2f343e;
  --ice: #d8ecf8; --frost: #d1e4fa; --mist: #c7d3ea; --fog: #9da7ba; --dim: #6b7487;
  --skywash: linear-gradient(180deg, #d8ecf8 0%, #98c0ef 100%);
  --violet: #663af3; --violet-hi: #7a52f5; --blueprint: #b6d9fc;
  --ember: #e46d4c; --teal: #269684; --amber: #e2b55b;
  --edge: rgba(186,215,247,.12); --edge-hi: rgba(186,215,247,.24); --wash: rgba(186,214,247,.06); --wash-hi: rgba(186,214,247,.12);
  --glass: rgba(186,214,247,.03); --tint: rgba(199,211,234,.12);
  --card-shadow: inset 0 1px 1px rgba(199,211,234,.1), inset 0 24px 48px rgba(199,211,234,.03), 0 16px 32px rgba(6,6,14,.6);
  --modal-shadow: inset 0 1px 1px rgba(216,236,248,.2), inset 0 24px 48px rgba(168,216,245,.06), 0 16px 32px rgba(0,0,0,.3);
  --sans: "Inter", "Untitled Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --display: "Space Grotesk", "aeonikPro", ui-sans-serif, system-ui, sans-serif;
  --mono: "JetBrains Mono", "dotDigital", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-card: 16px; --r-badge: 6px; --r-pill: 999px; --side: 248px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { overflow-x: clip; }
html, body { background: var(--canvas); }
body { margin: 0; color: var(--frost); font: 400 14px/1.5 var(--sans); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
button, input, select { font-family: inherit; }
a { color: var(--blueprint); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: var(--mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--blueprint); outline-offset: 2px; }
.atmos { position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(rgba(186,215,247,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(186,215,247,.035) 1px, transparent 1px);
  background-size: 88px 88px; -webkit-mask-image: radial-gradient(ellipse 90% 80% at 60% 0%, #000 20%, transparent 80%); mask-image: radial-gradient(ellipse 90% 80% at 60% 0%, #000 20%, transparent 80%); }

/* buttons: pills */
button, .btn { font-size: 13px; font-weight: 500; border-radius: var(--r-pill); padding: 7px 14px; cursor: pointer; border: 0; line-height: 1.4;
  background: var(--wash); color: #fff; box-shadow: inset 0 0 0 1px var(--edge); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  transition: background-color .15s ease, box-shadow .15s ease; text-decoration: none; }
button:hover, .btn:hover { background: var(--wash-hi); text-decoration: none; }
button.primary { background: var(--violet); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 6px 18px rgba(102,58,243,.3); }
button.primary:hover { background: var(--violet-hi); }
button.ghost { background: transparent; box-shadow: none; color: var(--fog); }
button.ghost:hover { color: var(--frost); background: var(--wash); }
button.danger { color: #f29a80; }
button:disabled { opacity: .45; cursor: default; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px; position: relative; overflow: hidden; }
.signin::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 640px; pointer-events: none;
  background: conic-gradient(from 180deg at 50% -8%, transparent 44%, rgba(124,145,182,.2) 48.5%, rgba(124,145,182,.4) 50%, rgba(124,145,182,.2) 51.5%, transparent 56%);
  -webkit-mask-image: linear-gradient(#000 20%, transparent 95%); mask-image: linear-gradient(#000 20%, transparent 95%); }
.authcard { width: 100%; max-width: 380px; border-radius: var(--r-card); padding: 32px; background: rgba(5,6,15,.97); box-shadow: var(--modal-shadow), 0 0 0 1px var(--edge); position: relative; }
.authcard .mark { display: flex; justify-content: center; margin-bottom: 18px; }
.authcard .mark svg { width: 40px; height: 40px; }
.authcard h1 { font: 500 30px/1.15 var(--display); text-align: center; margin: 0 0 6px; }
.authcard p.sub { text-align: center; color: var(--fog); margin: 0 0 24px; font-size: 14px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12.5px; color: var(--mist); font-weight: 500; }
input[type=text], input[type=password], input[type=search], select { font-size: 14px; padding: 9px 11px; border-radius: var(--r-badge); border: 0; box-shadow: inset 0 0 0 1px var(--edge); background: rgba(199,211,234,.06); color: #fff; width: 100%; }
select option { background: #0b0d1a; }
input::placeholder { color: rgba(199,211,234,.5); }
input:focus, select:focus { outline: none; box-shadow: inset 0 0 0 1px var(--edge-hi), 0 0 0 3px rgba(102,58,243,.25); }
.authcard button.primary { width: 100%; justify-content: center; padding: 11px; border-radius: var(--r-badge); font-size: 14px; margin-top: 6px; }
.authcard .err { color: #f29a80; font-size: 13px; min-height: 20px; margin: 10px 0 0; text-align: center; }
.authcard .foot { font-size: 12px; color: var(--dim); text-align: center; margin-top: 20px; }

/* shell */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 18px 14px; background: rgba(8,10,22,.85); box-shadow: 1px 0 0 var(--edge); backdrop-filter: blur(12px); z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; font: 500 17px var(--display); color: var(--frost); padding: 4px 8px 14px; }
.brand svg { width: 22px; height: 22px; }
.envsel { position: relative; margin: 0 0 14px; }
.envbtn { width: 100%; justify-content: space-between; border-radius: 10px; padding: 9px 11px; text-align: left; background: var(--wash); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.envbtn .lbl { display: grid; line-height: 1.25; flex: 1; }
.envbtn .lbl b { font-weight: 600; font-size: 13px; }
.envbtn .lbl small { color: var(--fog); font-size: 11.5px; font-weight: 400; }
.dot.prod { background: var(--teal); box-shadow: 0 0 8px rgba(38,150,132,.8); }
.dot.stage { background: var(--amber); box-shadow: 0 0 8px rgba(226,181,91,.6); }
.menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: #0b0d1a; border-radius: 12px; box-shadow: var(--modal-shadow), 0 0 0 1px var(--edge); padding: 6px; z-index: 50; display: grid; gap: 2px; }
.menu button { width: 100%; justify-content: flex-start; align-items: flex-start; background: transparent; box-shadow: none; border-radius: 8px; padding: 8px 10px; text-align: left; white-space: normal; }
.menu button .dot { margin-top: 6px; }
.menu button:hover { background: var(--wash-hi); }
.menu .hint { font-size: 12px; color: var(--fog); padding: 6px 10px 4px; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--fog); font-weight: 500; font-size: 13.5px; }
.nav a:hover { background: var(--wash); color: var(--frost); text-decoration: none; }
.nav a.on { background: var(--wash-hi); color: #fff; box-shadow: inset 2px 0 0 var(--violet); }
.nav .count { margin-left: auto; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 9px; background: rgba(226,181,91,.18); color: #f1cf86; }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; box-shadow: 0 -1px 0 var(--edge); }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(102,58,243,.3); color: #e0d6ff; font-weight: 600; font-size: 13px; text-transform: uppercase; flex: none; }
.me .who { display: grid; line-height: 1.25; min-width: 0; flex: 1; }
.me .who b { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.me .who small { color: var(--fog); font-size: 11.5px; }

.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 14px 28px; background: rgba(5,6,15,.78); backdrop-filter: blur(12px); box-shadow: 0 1px 0 var(--edge); min-height: 62px; }
.top h1 { font: 500 20px/1.2 var(--display); margin: 0; color: var(--ice); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb { color: var(--fog); font-size: 12.5px; white-space: nowrap; }
.crumb a { color: var(--fog); }
.top .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; position: relative; }
.menubtn { display: none; }
.content { padding: 24px 28px 64px; max-width: 1320px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; width: 272px; transform: translateX(-100%); transition: transform .2s ease; }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.55); }
  .menubtn { display: inline-flex; }
  .top { padding: 12px 16px; }
  .content { padding: 18px 16px 48px; }
}

/* cards, grids */
.card { background: var(--glass); border-radius: var(--r-card); padding: 20px; min-width: 0; box-shadow: var(--card-shadow), inset 0 0 0 1px rgba(186,215,247,.05); }
.card h2 { font: 500 16px/1.3 var(--display); margin: 0 0 4px; color: var(--ice); display: flex; align-items: center; gap: 8px; }
.card .sub { color: var(--fog); font-size: 13px; margin: 0 0 14px; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g32 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g32 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .g4, .g2 { grid-template-columns: minmax(0, 1fr); } }
.kpi .label { font-size: 12.5px; color: var(--fog); }
.kpi .val { font: 500 32px/1.15 var(--display); color: var(--ice); margin-top: 6px; }
.kpi .foot { font-size: 12px; color: var(--fog); margin-top: 2px; }
.kpi.alert .val { color: #f1cf86; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--fog); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12px; }

/* badges */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; line-height: 1.4; padding: 2px 8px; border-radius: var(--r-badge); background: var(--tint); color: var(--frost); white-space: nowrap; }
.pill.open { background: rgba(226,181,91,.16); color: #f1cf86; }
.pill.open::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #f1cf86; animation: pulse 1.6s ease-in-out infinite; }
.pill.bad { background: rgba(228,109,76,.18); color: #f29a80; }
.pill.warn { background: rgba(226,181,91,.14); color: #f1cf86; }
.pill.good { background: rgba(38,150,132,.18); color: #6fd3c1; }
.pill.done { background: rgba(38,150,132,.22); color: #8de3d4; }
.pill.agent { background: rgba(102,58,243,.28); color: #d9ccff; }
.pill.person { background: rgba(228,109,76,.14); color: #f4b19c; }
.pill.bot { background: rgba(38,150,132,.16); color: #7fd8c8; }
.pill.sys { background: var(--tint); color: var(--mist); }
@keyframes pulse { 50% { opacity: .3; } }

/* tables */
.tablewrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 10px; box-shadow: inset 0 -1px 0 var(--edge); vertical-align: top; }
th { font: 500 10.5px var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: rgba(186,214,247,.035); }
td.num { font-variant-numeric: tabular-nums; text-align: right; }
.strong { color: var(--ice); font-weight: 500; }
.idcell { font-family: var(--mono); font-size: 12px; color: var(--ice); white-space: nowrap; }
.empty { padding: 28px 12px; text-align: center; color: var(--fog); }
.empty b { display: block; color: var(--mist); font-weight: 500; font-size: 14px; margin-bottom: 4px; }

/* chips / tabs */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { padding: 5px 12px; font-size: 12.5px; color: var(--mist); }
.chips button[aria-pressed="true"] { background: var(--wash-hi); color: #fff; box-shadow: inset 0 0 0 1px var(--edge-hi); }
.tabs { display: flex; gap: 4px; box-shadow: inset 0 -1px 0 var(--edge); margin: 18px 0; overflow-x: auto; }
.tabs a { padding: 9px 14px; color: var(--fog); font-weight: 500; font-size: 13.5px; white-space: nowrap; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--frost); text-decoration: none; }
.tabs a.on { color: #fff; border-bottom-color: var(--violet); }

/* incident */
.inc-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 18px 0 0; padding: 0; }
.steps li { list-style: none; text-align: center; font-size: 12px; color: var(--fog); position: relative; padding-top: 26px; }
.steps li::before { content: ""; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; border-radius: 50%; background: var(--canvas); box-shadow: inset 0 0 0 1px var(--edge-hi); z-index: 1; }
.steps li::after { content: ""; position: absolute; top: 9px; left: -50%; width: 100%; height: 2px; background: var(--edge); }
.steps li:first-child::after { display: none; }
.steps li.done { color: var(--frost); }
.steps li.done::before { background: var(--teal); box-shadow: 0 0 8px rgba(38,150,132,.6); }
.steps li.done::after { background: rgba(38,150,132,.6); }
.steps li.now { color: var(--ice); font-weight: 500; }
.steps li.now::before { background: var(--violet); box-shadow: 0 0 0 4px rgba(102,58,243,.25), 0 0 12px rgba(102,58,243,.7); animation: pulse 1.6s ease-in-out infinite; }
.steps li.fail::before { background: var(--ember); }
.cause-card { border-radius: var(--r-card); padding: 22px; background: rgba(5,6,15,.97); box-shadow: var(--modal-shadow), 0 0 0 1px rgba(102,58,243,.35), 0 0 48px rgba(102,58,243,.14); position: relative; overflow: hidden; }
.cause-card::before { content: ""; position: absolute; inset: -60% -10% auto; height: 240px; background: radial-gradient(closest-side, rgba(102,58,243,.2), transparent); pointer-events: none; }
.eyebrow { font: 400 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mist); margin: 0 0 10px; }
.cause-card .cause { font: 500 32px/1.15 var(--display); margin: 0; position: relative; overflow-wrap: anywhere; background: var(--skywash); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cause-card .rid { font: 400 12px var(--mono); color: var(--fog); margin: 2px 0 12px; }
.cause-card .plain { font-size: 16px; line-height: 1.55; color: var(--frost); margin: 0; position: relative; }
.cause-card details { margin-top: 12px; color: var(--mist); font-size: 13px; position: relative; }
.cause-card details p { margin: 8px 0 0; line-height: 1.6; overflow-wrap: anywhere; }
.cause-card .foot { font-size: 12px; color: var(--fog); margin-top: 14px; display: flex; gap: 4px 14px; flex-wrap: wrap; position: relative; }
.multi { margin: 14px 0 0; padding: 10px 14px; background: rgba(228,109,76,.14); color: #f6b3a0; border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(228,109,76,.35); font-weight: 500; position: relative; }
details summary { cursor: pointer; color: var(--mist); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; margin: 14px 0 16px; font-size: 13.5px; }
.kv dt { color: var(--fog); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--frost); }
.kv code { color: var(--blueprint); }
.action + .action { margin-top: 18px; padding-top: 18px; box-shadow: 0 -1px 0 var(--edge); }
.action h3 { font: 500 17px var(--display); margin: 0; color: var(--ice); }
.action .why { margin: 8px 0 0; color: var(--mist); }
.as { font-size: 12.5px; color: var(--fog); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 74px 14px minmax(0, 1fr); gap: 10px; font-size: 13.5px; align-items: baseline; padding: 6px 0; }
.timeline .t { font: 400 11.5px var(--mono); color: var(--fog); }
.timeline .d { width: 9px; height: 9px; border-radius: 50%; background: var(--steel); align-self: center; }
.timeline li.ctx .x { color: rgba(157,167,186,.6); }
.timeline li.cause .x { color: var(--ice); font-weight: 500; }
.timeline li.cause .d { background: var(--ember); box-shadow: 0 0 10px rgba(228,109,76,.8); }
.timeline li.kalerts .x { color: #f1cf86; }
.timeline li.kalerts .d { background: var(--amber); }
.timeline li.kdecided .x { color: var(--ice); font-weight: 600; }
.timeline li.kdecided .d { background: var(--violet); box-shadow: 0 0 10px rgba(102,58,243,.8); }
.tag-cause { font-size: 10.5px; font-weight: 600; margin-left: 8px; padding: 1px 7px; border-radius: var(--r-badge); background: rgba(228,109,76,.2); color: #f29a80; }
.bar { height: 5px; border-radius: 3px; background: var(--wash-hi); margin-top: 6px; min-width: 70px; overflow: hidden; }
.bar span { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #98c0ef, #d8ecf8); }
tr.lead .bar span { background: linear-gradient(90deg, var(--violet), #b39bff); }
pre { background: rgba(5,6,15,.8); box-shadow: inset 0 0 0 1px var(--edge); color: var(--mist); padding: 10px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 8px 0; }

/* graph, topology, charts */
.cyb { height: 520px; border-radius: 12px; background: radial-gradient(ellipse at 50% 0%, rgba(124,145,182,.07), transparent 70%), rgba(5,6,15,.6); box-shadow: inset 0 0 0 1px var(--edge); }
.legend { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 12px; color: var(--fog); margin-top: 10px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--mist); vertical-align: middle; margin-right: 6px; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.topo { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .topo { grid-template-columns: minmax(0, 1fr); } }
.topo .cyb { height: calc(100vh - 210px); min-height: 440px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.list li { padding: 7px 10px; border-radius: 8px; background: var(--wash); font-size: 13px; }
.chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 8px; }
.chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.chart span.b { width: 100%; max-width: 24px; border-radius: 4px 4px 2px 2px; background: linear-gradient(180deg, #98c0ef, rgba(152,192,239,.3)); min-height: 2px; }
.chart small { font-size: 10px; color: var(--dim); font-family: var(--mono); }
.lb { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 8px 14px; align-items: center; font-size: 13px; }
.lb .bar { margin: 0; }
.statusdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.statusdot.ok { background: var(--teal); box-shadow: 0 0 8px rgba(38,150,132,.8); }
.statusdot.warn { background: var(--amber); }
.statusdot.off { background: var(--steel); }
.statusdot.bad { background: var(--ember); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(2,3,8,.66); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal { width: 100%; max-width: 500px; border-radius: var(--r-card); padding: 24px; background: rgba(5,6,15,.98); box-shadow: var(--modal-shadow), 0 0 0 1px var(--edge-hi); }
.modal h3 { font: 500 20px var(--display); margin: 0 0 8px; color: var(--ice); }
.modal p { color: var(--mist); margin: 0 0 12px; }
.modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

      el("a", { href: `#/topology/${encodeURIComponent(id)}` }, "Open in Topology →")); } });
}

/* ---------- Changes ---------- */
let chFilter = "all", chWindow = 1440;
async function pChanges(page) {
  setTitle("Changes");
  const d = await api(`changes?minutes=${chWindow}&limit=200`);
  const cat = (c) => c.by_agent ? "rootgraph" : c.actor ? "people" : "discovery";
  const shown = d.changes.filter(c => chFilter === "all" || cat(c) === chFilter);
  const chip = (k, label) => el("button", { "aria-pressed": String(chFilter === k), onclick: () => { chFilter = k; route(); } }, `${label} (${k === "all" ? d.changes.length : d.changes.filter(c => cat(c) === k).length})`);
  const win = el("select", { "aria-label": "Time window", style: "width:auto", onchange: (e) => { chWindow = +e.target.value; route(); } },
    ...[[60, "Last hour"], [1440, "Last 24 hours"], [10080, "Last 7 days"]].map(([v, l]) => el("option", { value: v, selected: v === chWindow ? "" : null }, l)));
  page.replaceChildren(el("div", { class: "card" },
    el("p", { class: "sub" }, S.env === "prod" ? "Every change to the AWS account: CloudTrail says who did it, discovery's graph diff says what actually changed. Changes made by hand in the console appear within a minute or two." : "Changes the drills made to the simulated estate."),
    el("div", { class: "row", style: "margin-bottom:12px" }, el("div", { class: "chips" }, chip("all", "All"), chip("people", "People"), chip("rootgraph", "rootgraph"), chip("discovery", "Discovery")), el("span", { class: "spacer" }), win),
    shown.length ? table(["Time", "Change", "By", "Source"], shown.map(c => ({ data: c, cells: [el("span", { class: "mono muted" }, chWindow > 1440 ? fmtTime(c.at) : hhmmss(c.at)),
      el("span", {}, describe(c), (c.resources || []).length ? el("div", {}, ...c.resources.map((r, i) => [i ? " · " : "", el("a", { class: "small", href: `#/topology/${encodeURIComponent(r)}` }, nm(r))])) : null),
      whoPill(c), el("span", { class: "muted small" }, c.source === "cloudtrail" ? "CloudTrail" : "graph diff")] }))) : empty("No changes in this window")));
}

/* ---------- Actions ---------- */
// AWS errors carry a long encoded blob: keep the readable first sentence, the rest is in the tooltip
const shortDetail = (d) => { if (!d) return ""; const t = d.split(" Encoded authorization failure message")[0]; return t.length > 160 ? t.slice(0, 157) + "…" : t; };
async function pActions(page) {
  setTitle("Actions");
  const rows = await api("actions?limit=300");
  page.replaceChildren(el("div", { class: "card" }, el("p", { class: "sub" }, "Audit log of every fix rootgraph proposed: who approved it, when it ran, and whether verification passed."),
    rows.length ? table(["Proposed", "Action", "Target", "Incident", "Status", "Approved by", "Result"],
      rows.map(a => ({ data: a, cells: [el("span", { class: "mono muted" }, fmtTime(a.proposed_at)), el("span", { class: "strong" }, ACTION[a.kind] || a.kind), nm(a.target),
        el("a", { class: "idcell", href: `#/incidents/${a.incident}` }, a.incident), st(a.status), a.approved_by || el("span", { class: "muted" }, "—"), el("span", { class: "muted small", title: a.detail || "" }, shortDetail(a.detail))] })))
      : empty("No actions yet", "Fixes appear here once rootgraph proposes them.")));
}

/* ---------- Topology ---------- */
async function pTopology(page, parts, quiet) {
  if (quiet) return;
  setTitle("Topology");
  if (!S.graph) await loadGraph();
  const sel = parts[1] || null;
  const box = el("div", { class: "cyb" }), panel = el("div", { class: "card" });
  const search = el("input", { type: "search", placeholder: "Find a resource…", "aria-label": "Find a resource", list: "rids",
    onchange: (e) => { const v = e.target.value.trim(); const hit = S.graph.nodes.find(n => n.rid === v || n.name === v); if (hit) location.hash = `#/topology/${encodeURIComponent(hit.rid)}`; } });
  page.replaceChildren(el("div", { class: "topo" }, el("div", { class: "card" }, el("div", { class: "row", style: "margin-bottom:12px" },
    el("h2", { style: "margin:0" }, "Infrastructure graph"), el("span", { class: "spacer" }),
    el("div", { style: "width:260px;max-width:100%" }, search, el("datalist", { id: "rids" }, ...S.graph.nodes.map(n => el("option", { value: n.name || n.rid }))))), box,
    el("div", { class: "legend" }, el("span", {}, el("i"), "depends on"), el("span", {}, el("i", { style: "border-top:1.5px dashed var(--fog)" }), "runs on · protects"),
      el("span", {}, el("i", { style: "border-top:1.5px dotted var(--fog)" }), "allowed by rule"), el("span", {}, el("b", { style: "background:#3a1d16;box-shadow:inset 0 0 0 2px var(--ember)" }), "blast radius of the selection"))), panel));
  const cy = drawGraph(box, { selected: sel, onTap: (id) => location.hash = `#/topology/${encodeURIComponent(id)}` });
  if (!sel) { panel.replaceChildren(el("h2", {}, "Select a resource"), el("p", { class: "sub", style: "margin:0" }, `${S.graph.nodes.length} resources and ${S.graph.edges.length} relationships. Click any node to see what depends on it, what protects it, and what changed.`)); return; }
  panel.replaceChildren(el("p", { class: "muted" }, "Loading…"));
  const r = await api(`resources/${encodeURIComponent(sel)}`);
  const blast = new Set(r.blast_radius.map(b => b.affected));
  if (cy) cy.nodes().forEach(n => { if (blast.has(n.id())) n.addClass("blast"); });
  const sec = (title, kids) => [el("p", { class: "eyebrow", style: "margin:18px 0 8px" }, title), kids];
  const li = (rid, extra) => el("li", {}, el("a", { href: `#/topology/${encodeURIComponent(rid)}` }, nm(rid)), extra ? el("span", { class: "muted small" }, " · " + extra) : null);
  const none = (t) => el("p", { class: "muted small", style: "margin:0" }, t);
  panel.replaceChildren(el("h2", {}, nm(r.rid)), el("p", { class: "sub mono", style: "margin:0" }, [r.rid, KLABEL[S.kinds[r.rid]], r.state, r.status].filter(Boolean).join(" · ")),
    ...sec(`Blast radius (${r.blast_radius.length})`, r.blast_radius.length ? el("ul", { class: "list" }, ...r.blast_radius.map(b => li(b.affected, b.hops != null ? `${b.hops} hop${b.hops > 1 ? "s" : ""}` : ""))) : none("Nothing depends on it.")),
    ...sec("Depends on", r.depends_on.length ? el("ul", { class: "list" }, ...r.depends_on.map(d => li(d.target, [d.kind, d.port].filter(Boolean).join(" ")))) : none("No declared dependencies.")),
    ...sec("Protected by", r.firewalls.length ? el("ul", { class: "list" }, ...r.firewalls.map(f => li(f))) : none("No security groups.")),
    ...sec("Changes, last 7 days", r.changes.length ? el("ul", { class: "list" }, ...r.changes.slice(0, 8).map(c => el("li", {}, el("span", { class: "mono muted" }, fmtTime(c["ch.at"]) + "  "),
      `${c["ch.event_name"]} · ${who({ actor: c["ch.actor"], by_agent: c["ch.by_agent"], source: c["ch.source"] })}`))) : none("No changes.")),
    ...sec("Incidents", r.incidents.length ? el("ul", { class: "list" }, ...r.incidents.map(i => el("li", {}, el("a", { href: `#/incidents/${i.id}` }, i.id), el("span", { class: "muted small" }, ` · ranked #${i.rank} · ${i.status}`)))) : none("Never a suspect.")));
}

/* ---------- Memory ---------- */
async function pMemory(page) {
  setTitle("Memory");
  const rows = await api("memory");
  page.replaceChildren(el("div", { class: "card" },
    el("p", { class: "sub" }, "What rootgraph has learned. Every resolved incident stays in the graph with its root cause, the change behind it and the fix that worked. When similar alerts fire again, it recalls them and offers the proven fix first."),
    rows.length ? table(["Incident", "Root cause", "Caused by", "Fix that worked", "Resolved in", "Approved by", "Recalled"],
      rows.map(m => ({ data: m, cells: [el("span", { class: "idcell" }, m.id),
        el("span", {}, el("span", { class: "strong" }, m.root_name || m.root_cause), el("div", { class: "muted small" }, KLABEL[kindOf(m.root_kinds || [])] || "")),
        m.change ? el("span", {}, m.change, el("div", { class: "muted small" }, m.actor ? who({ actor: m.actor }) : "seen by discovery")) : el("span", { class: "muted" }, "—"),
        m.fix ? ACTION[m.fix] || m.fix : "—", dur(m.ttr_seconds), m.approved_by || "—",
        m.recalled_by.length ? el("span", { class: "pill agent", title: m.recalled_by.join(", ") }, `${m.recalled_by.length}× by later incidents`) : el("span", { class: "muted small" }, "not yet")] })),
      (m) => location.hash = `#/incidents/${m.id}`) : empty("Nothing learned yet", "Resolved incidents become memory automatically.")));
}

/* ---------- Integrations ---------- */
async function pIntegrations(page) {
  setTitle("Integrations");
  const x = await api("integrations"), prod = S.env === "prod";
  const card = (title, state, lines) => el("div", { class: "card" }, el("h2", {}, el("span", { class: "statusdot " + state }), title),
    el("dl", { class: "kv", style: "margin:12px 0 0" }, ...lines.filter(Boolean).flatMap(([k, v]) => [el("dt", {}, k), el("dd", {}, v)])));
  page.replaceChildren(el("div", { class: "grid" },
    el("div", { class: "card", style: "padding:14px 20px" }, el("div", { class: "row" }, el("span", { class: "dot " + (prod ? "prod" : "stage") }),
      el("span", { class: "strong" }, x.environment.name), el("span", { class: "muted" }, "· " + x.environment.detail), el("span", { class: "spacer" }), el("span", { class: "mono muted" }, "graph " + x.environment.graph))),
    el("div", { class: "grid g2" },
      card("FalkorDB graph", x.falkordb.ok ? "ok" : "bad", [["Status", x.falkordb.ok ? "connected" : "unreachable"], ["Graph", el("code", {}, x.falkordb.graph)], ["Holds", `${x.falkordb.resources} resources · ${x.falkordb.edges} relationships`]]),
      card("AWS discovery", prod ? (x.discovery.last_sync && Date.now() / 1000 - x.discovery.last_sync < 600 ? "ok" : "warn") : "off", [["Mode", x.discovery.mode], ["Last sync", x.discovery.last_sync ? `${ago(x.discovery.last_sync)}` : "—"]]),
      card("CloudTrail change stream", x.cloudtrail.configured ? "ok" : "off", [["Path", x.cloudtrail.path], ["Status", x.cloudtrail.configured ? "connected" : prod ? "not configured" : "not used in staging"],
        ["Last event", x.cloudtrail.last_event ? ago(x.cloudtrail.last_event) : "—"], ["In the graph", `${x.cloudtrail.events} CloudTrail events · ${x.cloudtrail.changes} changes in total`]]),
      card("Alerts", prod ? (x.alerts.prometheus_ready ? "ok" : "bad") : "off", [["Source", x.alerts.source], prod ? ["Prometheus", x.alerts.prometheus_ready ? "ready" : "unreachable"] : null,
        ["Last alert", x.alerts.last_alert ? ago(x.alerts.last_alert) : "—"], ["Received", `${x.alerts.alerts || 0} alerts`]]),
      card("AI agent", x.ai.configured ? "ok" : "off", [["Provider", x.ai.provider], ["Models", x.ai.models.length ? el("span", {}, ...x.ai.models.map((m, i) => [i ? " → " : "", el("code", {}, m)])) : "none"],
        ["Last answer", x.ai.last_explained_by ? humanExplainer(x.ai.last_explained_by) : "—"], ["Guardrails", x.ai.guardrails]]),
      card("Executor", "ok", [["Runs as", x.executor.principal], ["Approval", x.executor.approval],
        ["May do", el("ul", { class: "list" }, ...x.executor.actions.map(a => el("li", {}, el("span", { class: "strong" }, ACTION[a.kind] || a.kind), el("span", { class: "muted small" }, " on " + a.targets.map(t => KLABEL[t] || t).join(", ")))))],
        ["May not", "delete or stop anything, or act without approval"]]))));
}

start();
