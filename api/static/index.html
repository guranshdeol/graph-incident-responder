<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>rootgraph console</title>
<meta name="description" content="rootgraph: incident root cause on a FalkorDB graph of your infrastructure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
/* Tokens and rules from docs/DESIGN.md: an operations desk on paper. Ink, hairlines, one signal colour
   (#e4f222) for whatever needs a person; red/amber/green only report state. IBM Plex Sans + Geist Mono. */
:root {
  --canvas: #f4f2f0; --paper: #ffffff; --wash: #f4f2f0; --ink: #0c0a08; --obsidian: #1a1919;
  --ash: #6d6c6b; --smoke: #a3a2a0; --hair: #e5e7eb; --hair-strong: #d3d3d3;
  --signal: #e4f222; --signal-ink: #0c0a08;
  --bad: #b42318; --bad-bg: #fdecea; --warn: #8a5a00; --warn-bg: #fbf1d6; --ok: #1e6b3a; --ok-bg: #e3f2e8;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-btn: 6px; --r-in: 8px; --r-panel: 12px; --r-card: 14px; --side: 244px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { overflow-x: clip; }
html, body { background: var(--canvas); }
body { margin: 0; color: var(--ink); font: 400 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
button, input, select { font-family: inherit; }
a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hair-strong); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--ink); }
code, pre { font-family: var(--mono); font-size: 12px; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.atmos { display: none; }

/* buttons */
button, .btn { font-size: 13px; font-weight: 500; border-radius: var(--r-btn); padding: 7px 13px; cursor: pointer; border: 1px solid var(--ink); line-height: 1.4;
  background: transparent; color: var(--ink); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; text-decoration: none;
  transition: background-color .2s ease-out, border-color .2s ease-out, color .2s ease-out; }
button:hover, .btn:hover { background: var(--wash); }
button.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
button.primary:hover { background: #d6e41a; border-color: #d6e41a; }
button.ghost { border-color: transparent; color: var(--ash); }
button.ghost:hover { color: var(--ink); background: var(--wash); }
button.danger { color: var(--bad); border-color: transparent; }
button:disabled { opacity: .45; cursor: default; }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* sign-in */
.signin { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.authcard { width: 100%; max-width: 380px; border-radius: var(--r-card); padding: 32px; background: var(--paper); border: 1px solid var(--hair); }
.authcard .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; font: 500 18px var(--sans); }
.authcard .mark svg { width: 26px; height: 26px; }
.authcard h1 { font: 500 22px/1.2 var(--sans); letter-spacing: -0.01em; margin: 0 0 6px; }
.authcard p.sub { color: var(--ash); margin: 0 0 24px; font-size: 14px; }
.field { display: grid; gap: 6px; margin-bottom: 14px; }
.field label { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ash); }
input[type=text], input[type=password], input[type=search], select { font-size: 14px; padding: 8px 11px; border-radius: var(--r-in); border: 1px solid var(--hair-strong); background: var(--paper); color: var(--ink); width: 100%; transition: border-color .2s ease-out; }
input::placeholder { color: var(--smoke); }
input:focus, select:focus { outline: none; border-color: var(--ink); }
.authcard button.primary { width: 100%; justify-content: center; padding: 10px; font-size: 14px; margin-top: 8px; }
.authcard .err { color: var(--bad); font-size: 13px; min-height: 20px; margin: 10px 0 0; }
.authcard .foot { font-size: 12px; color: var(--ash); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--hair); }

/* shell */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 6px; padding: 18px 12px; background: var(--paper); border-right: 1px solid var(--hair); z-index: 30; }
.brand { display: flex; align-items: center; gap: 9px; font: 500 16px var(--sans); color: var(--ink); padding: 2px 8px 16px; }
.brand svg { width: 22px; height: 22px; }
.envsel { position: relative; margin: 0 0 14px; }
.envbtn { width: 100%; justify-content: space-between; border: 1px solid var(--hair-strong); padding: 8px 10px; text-align: left; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.prod { background: var(--ok); }
.dot.stage { background: #c98a00; }
.envbtn .lbl { display: grid; line-height: 1.3; flex: 1; }
.envbtn .lbl b { font-weight: 500; font-size: 13px; }
.envbtn .lbl small { color: var(--ash); font: 400 11px var(--mono); }
.menu { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--paper); border: 1px solid var(--hair-strong); border-radius: var(--r-panel); box-shadow: 0 12px 28px rgba(12,10,8,.08); padding: 5px; z-index: 50; display: grid; gap: 1px; }
.menu button { width: 100%; justify-content: flex-start; align-items: flex-start; border: 0; border-radius: var(--r-btn); padding: 8px 10px; text-align: left; white-space: normal; font-weight: 400; }
.menu button b { font-weight: 500; }
.menu button .dot { margin-top: 6px; }
.menu .hint { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ash); padding: 8px 10px 6px; }
.nav { display: grid; gap: 1px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--r-btn); color: var(--ash); font-weight: 500; font-size: 13.5px; text-decoration: none; transition: background-color .2s ease-out, color .2s ease-out; }
.nav a:hover { background: var(--wash); color: var(--ink); }
.nav a.on { background: var(--wash); color: var(--ink); box-shadow: inset 2px 0 0 var(--ink); }
.nav .count { margin-left: auto; font: 500 11px var(--mono); padding: 1px 7px; border-radius: var(--r-btn); background: var(--signal); color: var(--signal-ink); }
.me { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 8px 2px; border-top: 1px solid var(--hair); }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-weight: 500; font-size: 12px; text-transform: uppercase; flex: none; }
.me .who { display: grid; line-height: 1.3; min-width: 0; flex: 1; }
.me .who b { font-weight: 500; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.me .who small { color: var(--ash); font: 400 11px var(--mono); }

.main { min-width: 0; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 28px; background: var(--canvas); border-bottom: 1px solid var(--hair); min-height: 60px; }
.top h1 { font: 500 22px/1.2 var(--sans); letter-spacing: -0.01em; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb { color: var(--ash); font: 400 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.crumb a { color: var(--ash); text-decoration: none; }
.crumb a:hover { color: var(--ink); }
.top .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; position: relative; }
.menubtn { display: none; }
.content { padding: 22px 28px 64px; max-width: 1360px; }
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; width: 268px; transform: translateX(-100%); transition: transform .2s ease-out; }
  .side.open { transform: none; box-shadow: 0 0 0 100vmax rgba(12,10,8,.35); }
  .menubtn { display: inline-flex; }
  .top { padding: 10px 16px; }
  .content { padding: 16px 16px 48px; }
}

/* cards, grids */
.card { background: var(--paper); border: 1px solid var(--hair); border-radius: var(--r-card); padding: 18px 20px; min-width: 0; }
.card h2 { font: 500 15px/1.3 var(--sans); margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
.card .sub { color: var(--ash); font-size: 13px; margin: 0 0 14px; }
.grid { display: grid; gap: 16px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g32 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g32 { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .g4, .g2 { grid-template-columns: minmax(0, 1fr); } }
/* live metric strip: the one dark band on Overview */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--obsidian); border-radius: var(--r-panel); color: #fff; }
.strip .kpi { padding: 16px 20px; border-left: 1px solid rgba(255,255,255,.1); }
.strip .kpi:first-child { border-left: 0; }
@media (max-width: 900px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } .strip .kpi:nth-child(3) { border-left: 0; } .strip .kpi:nth-child(n+3) { border-top: 1px solid rgba(255,255,255,.1); } }
.kpi .label { font: 500 10.5px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--smoke); }
.kpi .val { font: 400 28px/1.1 var(--sans); margin-top: 8px; }
.kpi .foot { font-size: 12px; color: var(--smoke); margin-top: 4px; }
.kpi.alert .val { color: var(--signal); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--ash); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12px; }

/* badges */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; line-height: 1.4; padding: 2px 8px; border-radius: var(--r-btn); background: var(--wash); color: var(--ink); white-space: nowrap; }
.pill.open { background: var(--signal); color: var(--signal-ink); }
.pill.open::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); animation: pulse 1.8s ease-in-out infinite; }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.good, .pill.done { background: var(--ok-bg); color: var(--ok); }
.pill.agent { background: var(--ink); color: var(--paper); }
.pill.person { background: var(--paper); color: var(--ink); border: 1px solid var(--ink); padding: 1px 7px; }
.pill.bot { background: var(--ok-bg); color: var(--ok); }
.pill.sys { background: var(--wash); color: var(--ash); }
@keyframes pulse { 50% { opacity: .25; } }

/* tables */
.tablewrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
th { font: 500 10.5px var(--mono); color: var(--ash); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--wash); }
td.num { text-align: right; }
.strong { font-weight: 500; }
.idcell { font-family: var(--mono); font-size: 12px; white-space: nowrap; text-decoration: none; }
.empty { padding: 28px 12px; text-align: center; color: var(--ash); }
.empty b { display: block; color: var(--ink); font-weight: 500; font-size: 14px; margin-bottom: 4px; }

/* chips / tabs */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { padding: 4px 11px; font-size: 12.5px; font-weight: 400; border-color: var(--hair-strong); color: var(--ash); }
.chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--hair); margin: 18px 0; overflow-x: auto; }
.tabs a { padding: 9px 14px; color: var(--ash); font-weight: 500; font-size: 13.5px; white-space: nowrap; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--ink); border-bottom-color: var(--ink); box-shadow: inset 0 -4px 0 -2px var(--signal); }

/* incident */
.inc-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); margin: 18px 0 0; padding: 0; }
.steps li { list-style: none; text-align: center; font-size: 12px; color: var(--smoke); position: relative; padding-top: 24px; }
.steps li::before { content: ""; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 1px solid var(--hair-strong); z-index: 1; }
.steps li::after { content: ""; position: absolute; top: 9px; left: -50%; width: 100%; height: 1px; background: var(--hair-strong); }
.steps li:first-child::after { display: none; }
.steps li.done { color: var(--ink); }
.steps li.done::before { background: var(--ink); border-color: var(--ink); }
.steps li.done::after { background: var(--ink); }
.steps li.now { color: var(--ink); font-weight: 500; }
.steps li.now::before { background: var(--signal); border-color: var(--ink); width: 13px; height: 13px; top: 3px; }
.steps li.fail::before { background: var(--bad); border-color: var(--bad); }
/* root cause: the one dark plate on an incident page */
.cause-card { border-radius: var(--r-panel); padding: 22px 24px; background: var(--obsidian); color: #fff; }
.eyebrow { font: 500 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ash); margin: 0 0 10px; }
.cause-card .eyebrow { color: var(--smoke); }
.cause-card .cause { font: 500 30px/1.15 var(--sans); letter-spacing: -0.01em; margin: 0; overflow-wrap: anywhere; color: #fff; }
.cause-card .rid { font: 400 12px var(--mono); color: var(--smoke); margin: 4px 0 14px; }
.cause-card .plain { font-size: 15.5px; line-height: 1.55; color: #f1f0ee; margin: 0; }
.cause-card details { margin-top: 14px; color: #cfcdca; font-size: 13px; }
.cause-card details summary { color: #e8e6e3; }
.cause-card details p { margin: 8px 0 0; line-height: 1.6; overflow-wrap: anywhere; }
.cause-card .foot { font-size: 12px; color: var(--smoke); margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,.1); display: flex; gap: 4px 14px; flex-wrap: wrap; }
.cause-card a { color: #fff; text-decoration-color: rgba(255,255,255,.35); }
.multi { margin: 14px 0 0; padding: 10px 14px; background: var(--bad-bg); color: var(--bad); border-radius: var(--r-in); font-weight: 500; }
details summary { cursor: pointer; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 7px 18px; margin: 14px 0 16px; font-size: 13.5px; }
.kv dt { color: var(--ash); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.kv code { background: var(--wash); border-radius: 4px; padding: 1px 5px; }
.kv code.cmd { display: block; border: 1px solid var(--hair); border-radius: var(--r-in); padding: 7px 10px; }
.action + .action { margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--hair); }
.action h3 { font: 500 16px var(--sans); margin: 0; }
.action .why { margin: 8px 0 0; color: var(--ash); }
.as { font: 400 11px var(--mono); color: var(--ash); text-transform: uppercase; letter-spacing: .06em; }
.ok-text { color: var(--ok); }
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 70px 12px minmax(0, 1fr); gap: 10px; font-size: 13.5px; align-items: baseline; padding: 6px 0; }
.timeline .t { font: 400 11.5px var(--mono); color: var(--ash); }
.timeline .d { width: 8px; height: 8px; border-radius: 50%; background: var(--hair-strong); align-self: center; }
.timeline li.ctx .x { color: var(--smoke); }
.timeline li.cause .x { font-weight: 500; }
.timeline li.cause .d { background: var(--bad); }
.timeline li.kalerts .x { color: var(--warn); }
.timeline li.kalerts .d { background: #c98a00; }
.timeline li.kdecided .x { font-weight: 500; }
.timeline li.kdecided .d { background: var(--ink); }
.tag-cause { font-size: 10.5px; font-weight: 500; margin-left: 8px; padding: 1px 7px; border-radius: var(--r-btn); background: var(--bad-bg); color: var(--bad); }
.bar { height: 4px; border-radius: 2px; background: var(--hair); margin-top: 6px; min-width: 70px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--smoke); }
tr.lead .bar span, .lb .bar span { background: var(--ink); }
pre { background: var(--wash); border: 1px solid var(--hair); color: var(--ink); padding: 10px 12px; border-radius: var(--r-in); overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 8px 0; }

/* graph, topology, charts */
.cyb { height: 520px; border-radius: var(--r-panel); background: var(--paper); border: 1px solid var(--hair); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--ash); margin-top: 10px; }
.legend i { display: inline-block; width: 18px; height: 0; border-top: 1.5px solid var(--ash); vertical-align: middle; margin-right: 6px; }
.legend b { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
.topo { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .topo { grid-template-columns: minmax(0, 1fr); } }
.topo .cyb { height: calc(100vh - 200px); min-height: 440px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.list li { padding: 7px 10px; border-radius: var(--r-in); background: var(--wash); font-size: 13px; }
.list a { text-decoration: none; }
.chart { display: flex; align-items: flex-end; gap: 6px; height: 140px; padding-top: 8px; border-bottom: 1px solid var(--hair); }
.chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.chart span.b { width: 100%; max-width: 22px; border-radius: 3px 3px 0 0; background: var(--ink); min-height: 1px; }
.chart small { font: 400 10px var(--mono); color: var(--smoke); margin-bottom: -20px; }
.lb { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px 14px; align-items: center; font-size: 13px; }
.lb .bar { margin: 0; }
.statusdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.statusdot.ok { background: var(--ok); }
.statusdot.warn { background: #c98a00; }
.statusdot.off { background: var(--hair-strong); }
.statusdot.bad { background: var(--bad); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: rgba(12,10,8,.32); display: grid; place-items: center; z-index: 100; padding: 16px; }
.modal { width: 100%; max-width: 520px; border-radius: var(--r-card); padding: 22px 24px; background: var(--paper); border: 1px solid var(--hair-strong); box-shadow: 0 24px 48px rgba(12,10,8,.12); }
.modal h3 { font: 500 18px var(--sans); margin: 0 0 8px; }
.modal p { color: var(--ash); margin: 0 0 12px; }
.modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 120; max-width: min(420px, calc(100vw - 36px)); }
.toast { padding: 11px 14px; border-radius: var(--r-in); background: var(--obsidian); color: #fff; font-size: 13px; }
.toast.bad { background: var(--bad); }
</style>
</head>
<body>
<div class="atmos" aria-hidden="true"></div>
<div id="root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k instanceof Node ? k : String(k));
  return n;
};
const svgEl = (d, cls = "i") => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); if (cls) s.setAttribute("class", cls); s.innerHTML = d; return s; };
const I = {

  page.replaceChildren(el("div", { class: "card" },
    el("p", { class: "sub" }, S.env === "prod" ? "Every change to the AWS account: CloudTrail says who did it, discovery's graph diff says what actually changed. Changes made by hand in the console appear within a minute or two." : "Changes the drills made to the simulated estate."),
    el("div", { class: "row", style: "margin-bottom:12px" }, el("div", { class: "chips" }, chip("all", "All"), chip("people", "People"), chip("rootgraph", "rootgraph"), chip("discovery", "Discovery")), el("span", { class: "spacer" }), win),
    shown.length ? table(["Time", "Change", "By", "Source"], shown.map(c => ({ data: c, cells: [el("span", { class: "mono muted" }, chWindow > 1440 ? fmtTime(c.at) : hhmmss(c.at)),
      el("span", {}, describe(c), (c.resources || []).length ? el("div", {}, ...c.resources.map((r, i) => [i ? " · " : "", el("a", { class: "small", href: `#/topology/${encodeURIComponent(r)}` }, nm(r))])) : null),
      whoPill(c), el("span", { class: "muted small" }, c.source === "cloudtrail" ? "CloudTrail" : "graph diff")] }))) : empty("No changes in this window")));
}

/* ---------- Actions ---------- */
// AWS errors carry a long encoded blob: keep the readable first sentence, the rest is in the tooltip
const shortDetail = (d) => { if (!d) return ""; const t = d.split(" Encoded authorization failure message")[0]; return t.length > 160 ? t.slice(0, 157) + "…" : t; };
async function pActions(page) {
  setTitle("Actions");
  const rows = await api("actions?limit=300");
  page.replaceChildren(el("div", { class: "card" }, el("p", { class: "sub" }, "Audit log of every fix rootgraph proposed: who approved it, when it ran, and whether verification passed."),
    rows.length ? table(["Proposed", "Action", "Target", "Incident", "Status", "Approved by", "Result"],
      rows.map(a => ({ data: a, cells: [el("span", { class: "mono muted" }, fmtTime(a.proposed_at)), el("span", { class: "strong" }, ACTION[a.kind] || a.kind), nm(a.target),
        el("a", { class: "idcell", href: `#/incidents/${a.incident}` }, a.incident), st(a.status), a.approved_by || el("span", { class: "muted" }, "—"), el("span", { class: "muted small", title: a.detail || "" }, shortDetail(a.detail))] })))
      : empty("No actions yet", "Fixes appear here once rootgraph proposes them.")));
}

/* ---------- Topology ---------- */
async function pTopology(page, parts, quiet) {
  if (quiet) return;
  setTitle("Topology");
  if (!S.graph) await loadGraph();
  const sel = parts[1] || null;
  const box = el("div", { class: "cyb" }), panel = el("div", { class: "card" });
  const search = el("input", { type: "search", placeholder: "Find a resource…", "aria-label": "Find a resource", list: "rids",
    onchange: (e) => { const v = e.target.value.trim(); const hit = S.graph.nodes.find(n => n.rid === v || n.name === v); if (hit) location.hash = `#/topology/${encodeURIComponent(hit.rid)}`; } });
  page.replaceChildren(el("div", { class: "topo" }, el("div", { class: "card" }, el("div", { class: "row", style: "margin-bottom:12px" },
    el("h2", { style: "margin:0" }, "Infrastructure graph"), el("span", { class: "spacer" }),
    el("div", { style: "width:260px;max-width:100%" }, search, el("datalist", { id: "rids" }, ...S.graph.nodes.map(n => el("option", { value: n.name || n.rid }))))), box,
    el("div", { class: "legend" }, el("span", {}, el("i"), "depends on"), el("span", {}, el("i", { style: "border-top:1.5px dashed var(--smoke)" }), "runs on · protects"),
      el("span", {}, el("i", { style: "border-top:1.5px dotted var(--smoke)" }), "allowed by rule"), el("span", {}, el("b", { style: "background:#fdecea;box-shadow:inset 0 0 0 2px var(--bad)" }), "blast radius of the selection"))), panel));
  const cy = await drawGraph(box, { selected: sel, onTap: (id) => location.hash = `#/topology/${encodeURIComponent(id)}` });
  if (!sel) { panel.replaceChildren(el("h2", {}, "Select a resource"), el("p", { class: "sub", style: "margin:0" }, `${S.graph.nodes.length} resources and ${S.graph.edges.length} relationships. Click any node to see what depends on it, what protects it, and what changed.`)); return; }
  panel.replaceChildren(el("p", { class: "muted" }, "Loading…"));
  const r = await api(`resources/${encodeURIComponent(sel)}`);
  const blast = new Set(r.blast_radius.map(b => b.affected));
  if (cy) cy.nodes().forEach(n => { if (blast.has(n.id())) n.addClass("blast"); });
  const sec = (title, kids) => [el("p", { class: "eyebrow", style: "margin:18px 0 8px" }, title), kids];
  const li = (rid, extra) => el("li", {}, el("a", { href: `#/topology/${encodeURIComponent(rid)}` }, nm(rid)), extra ? el("span", { class: "muted small" }, " · " + extra) : null);
  const none = (t) => el("p", { class: "muted small", style: "margin:0" }, t);
  panel.replaceChildren(el("h2", {}, nm(r.rid)), el("p", { class: "sub mono", style: "margin:0" }, [r.rid, KLABEL[S.kinds[r.rid]], r.state, r.status].filter(Boolean).join(" · ")),
    ...sec(`Blast radius (${r.blast_radius.length})`, r.blast_radius.length ? el("ul", { class: "list" }, ...r.blast_radius.map(b => li(b.affected, b.hops != null ? `${b.hops} hop${b.hops > 1 ? "s" : ""}` : ""))) : none("Nothing depends on it.")),
    ...sec("Depends on", r.depends_on.length ? el("ul", { class: "list" }, ...r.depends_on.map(d => li(d.target, [d.kind, d.port].filter(Boolean).join(" ")))) : none("No declared dependencies.")),
    ...sec("Protected by", r.firewalls.length ? el("ul", { class: "list" }, ...r.firewalls.map(f => li(f))) : none("No security groups.")),
    ...sec("Changes, last 7 days", r.changes.length ? el("ul", { class: "list" }, ...r.changes.slice(0, 8).map(c => el("li", {}, el("span", { class: "mono muted" }, fmtTime(c["ch.at"]) + "  "),
      `${c["ch.event_name"]} · ${who({ actor: c["ch.actor"], by_agent: c["ch.by_agent"], source: c["ch.source"] })}`))) : none("No changes.")),
    ...sec("Incidents", r.incidents.length ? el("ul", { class: "list" }, ...r.incidents.map(i => el("li", {}, el("a", { href: `#/incidents/${i.id}` }, i.id), el("span", { class: "muted small" }, ` · ranked #${i.rank} · ${i.status}`)))) : none("Never a suspect.")));
}

/* ---------- Memory ---------- */
async function pMemory(page) {
  setTitle("Memory");
  const rows = await api("memory");
  page.replaceChildren(el("div", { class: "card" },
    el("p", { class: "sub" }, "What rootgraph has learned. Every resolved incident stays in the graph with its root cause, the change behind it and the fix that worked. When similar alerts fire again, it recalls them and offers the proven fix first."),
    rows.length ? table(["Incident", "Root cause", "Caused by", "Fix that worked", "Resolved in", "Approved by", "Recalled"],
      rows.map(m => ({ data: m, cells: [el("span", { class: "idcell" }, m.id),
        el("span", {}, el("span", { class: "strong" }, m.root_name || m.root_cause), el("div", { class: "muted small" }, KLABEL[kindOf(m.root_kinds || [])] || "")),
        m.change ? el("span", {}, m.change, el("div", { class: "muted small" }, m.actor ? who({ actor: m.actor }) : "seen by discovery")) : el("span", { class: "muted" }, "—"),
        m.fix ? ACTION[m.fix] || m.fix : "—", dur(m.ttr_seconds), m.approved_by || "—",
        m.recalled_by.length ? el("span", { class: "pill agent", title: m.recalled_by.join(", ") }, `${m.recalled_by.length}× by later incidents`) : el("span", { class: "muted small" }, "not yet")] })),
      (m) => location.hash = `#/incidents/${m.id}`) : empty("Nothing learned yet", "Resolved incidents become memory automatically.")));
}

      el("span", { class: "strong" }, x.environment.name), el("span", { class: "muted" }, "· " + x.environment.detail), el("span", { class: "spacer" }), el("span", { class: "mono muted" }, "graph " + x.environment.graph))),

        ["Last event", x.cloudtrail.last_event ? ago(x.cloudtrail.last_event) : "—"], ["In the graph", `${x.cloudtrail.events} CloudTrail events · ${x.cloudtrail.changes} changes in total`]]),
      card("Alerts", prod ? (x.alerts.prometheus_ready ? "ok" : "bad") : "off", [["Source", x.alerts.source], prod ? ["Prometheus", x.alerts.prometheus_ready ? "ready" : "unreachable"] : null,
        ["Last alert", x.alerts.last_alert ? ago(x.alerts.last_alert) : "—"], ["Received", `${x.alerts.alerts || 0} alerts`]]),
      card("AI agent", x.ai.configured ? "ok" : "off", [["Provider", x.ai.provider], ["Models", x.ai.models.length ? el("span", {}, ...x.ai.models.map((m, i) => [i ? " → " : "", el("code", {}, m)])) : "none"],
        ["Last answer", x.ai.last_explained_by ? humanExplainer(x.ai.last_explained_by) : "—"], ["Guardrails", x.ai.guardrails]]),

        ["May not", "delete or stop anything, or act without approval"]]))));
}
