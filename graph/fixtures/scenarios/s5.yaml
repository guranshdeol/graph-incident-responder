# S5: two faults at once: rule A revoked AND payments stopped.
# SYNTHETIC FIXTURE. A documented limitation: the scorecard ranks causes but does not
# split the alerts between them, so it reports "multiple likely causes".
id: s5
title: Two faults at once
faults:
  - revoke_rule: {fw: sg-db, rule_id: sgr-a, at_offset: -120}
  - cloudtrail:
      event_name: RevokeSecurityGroupIngress
      actor: arn:aws:iam::111122223333:user/alice
      rids: [sg-db]
      at_offset: -150
      request: {groupId: sg-db}
alerts:
  - {alertname: ServiceDown, rid: "svc:payments", severity: page}
  - {alertname: HighErrorRate, rid: "svc:checkout", severity: page}
  - {alertname: HighErrorRate, rid: "svc:web", severity: page}
  - {alertname: DependencyUnreachable, rid: i-host1, target_rid: "rds:orders-db", severity: page}
probes:
  "svc:web":      {up: 1, error_rate: 0.50, p95: 0.20}
  "svc:checkout": {up: 1, error_rate: 0.90, p95: 0.10}
  "svc:payments": {up: 0}
  "svc:orders":   {up: 1, error_rate: 0.00, p95: 0.08}
  "svc:reports":  {up: 1, error_rate: 0.00, p95: 0.10}
  i-host1:        {up: 1, cpu: 15}
  i-host2:        {up: 1, cpu: 18}
  "rds:orders-db": {reachable_from: {i-host1: 0, i-host2: 1}}
probes_after_fix:
  "svc:web":      {up: 1, error_rate: 0.00, p95: 0.10}
  "svc:checkout": {up: 1, error_rate: 0.00, p95: 0.10}
  "svc:payments": {up: 1, error_rate: 0.00, p95: 0.10}
  "rds:orders-db": {reachable_from: {i-host1: 1, i-host2: 1}}
expect:
  top_two: [sg-db, "svc:payments"]
  multiple_causes: true
