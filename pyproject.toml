[project]
name = "rootgraph"
version = "0.1.0"
description = "Graph-backed incident responder (WeMakeDevs x FalkorDB Graph Hacks)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.114",
    "falkordb",
    "fastapi>=0.143.3",
    "mcp>=2.3.0",
    "pyyaml",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "moto[cloudtrail,ec2,events,iam,rds,s3,sqs,ssm,sts]>=5.2.4",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
